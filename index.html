<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>デジタル教師手帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ripple-loader {
      width: 40px; height: 40px;
      border-radius: 50%; border: 3px solid #3b82f6;
      animation: ripple 1.2s infinite ease-in-out;
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .loading-dots::after {
      content: ''; animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; } 40% { content: '.'; }
      60% { content: '..'; } 80%, 100% { content: '...'; }
    }
    .slide-enter-right { animation: slideInRight 0.3s ease-out forwards; }
    .slide-enter-left { animation: slideInLeft 0.3s ease-out forwards; }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0.5; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-100%); opacity: 0.5; }
      to { transform: translateX(0); opacity: 1; }
    }
    .matrix-table { width: 100%; height: 100%; border-collapse: collapse; }
    .matrix-table tbody { height: 100%; }
    .matrix-table tr { height: 1%; }
    .matrix-table td, .matrix-table th { border: 1px solid #e5e7eb; padding: 4px; vertical-align: top; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden relative">

  <!-- ログイン画面 -->
  <div id="login-screen" class="fixed inset-0 bg-gray-800 z-[100] flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">📖 デジタル教師手帳</h2>
        <p class="text-sm text-gray-500 mt-2">アカウントにログインして同期</p>
      </div>
      <div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded border border-red-200"></div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">メールアドレス</label>
          <input type="email" id="auth-email" class="w-full border border-gray-300 p-2 rounded bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="teacher@example.com">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">パスワード</label>
          <input type="password" id="auth-pass" class="w-full border border-gray-300 p-2 rounded bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="6文字以上">
        </div>
        <div class="pt-2 space-y-3">
          <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded shadow transition-colors">ログイン</button>
          <button id="btn-signup" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded shadow transition-colors">新規アカウント登録</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-gray-800 text-white p-3 flex justify-between items-center shadow-md z-20">
    <h1 class="text-lg font-bold truncate flex-shrink-0 mr-2">📖 手帳</h1>
    <nav class="flex space-x-1 bg-gray-700 rounded-lg p-1 text-sm overflow-x-auto flex-1 justify-center hide-scrollbar" id="view-tabs">
      <button data-view="month" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">月</button>
      <button data-view="week" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">週</button>
      <button data-view="day" class="tab-btn px-2 py-1 md:px-3 rounded-md bg-white text-gray-800 font-bold whitespace-nowrap">日</button>
      <button data-view="year" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">年間</button>
      <button data-view="class-matrix" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">週授業</button>
    </nav>
    <div class="flex items-center ml-2 space-x-2">
      <button id="btn-scan" class="bg-blue-600 hover:bg-blue-500 p-1 md:px-2 rounded text-sm flex items-center shadow whitespace-nowrap" title="週報スキャン">📸</button>
      <button id="btn-settings" class="bg-gray-600 hover:bg-gray-500 p-1 md:px-2 rounded text-sm flex items-center shadow whitespace-nowrap" title="設定">⚙️</button>
      <button id="btn-logout" class="bg-gray-600 hover:bg-gray-500 p-1 md:px-2 rounded text-sm flex items-center shadow whitespace-nowrap" title="ログアウト">🚪</button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="swipe-container" class="flex-1 overflow-hidden relative p-2 touch-pan-y">
    <div id="view-container" class="bg-white h-full rounded-xl shadow-lg border border-gray-200 overflow-y-auto transition-transform duration-300 flex flex-col">
      <div class="flex h-full items-center justify-center text-gray-400">データを読み込み中...</div>
    </div>
  </main>

  <!-- 設定（APIキー）モーダル -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 flex flex-col">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">設定</h2>
      <label class="block text-sm font-semibold text-gray-600 mb-1">Gemini APIキー</label>
      <input type="text" id="api-key-input" class="w-full border border-gray-300 rounded p-2 mb-4 bg-gray-50 focus:bg-white outline-none ring-2 ring-blue-500" placeholder="AIzaSy...">
      <p class="text-xs text-gray-500 mb-4">※取得したAPIキーを入力してください。ブラウザ内に安全に保存されます。</p>
      <div class="flex justify-end space-x-2">
        <button id="btn-cancel-settings" class="px-4 py-2 bg-gray-200 rounded text-gray-700 font-semibold">キャンセル</button>
        <button id="btn-save-settings" class="px-4 py-2 bg-blue-600 text-white rounded font-semibold">保存</button>
      </div>
    </div>
  </div>

  <!-- 予定の編集モーダル -->
  <div id="event-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 flex flex-col">
      <h2 class="text-xl font-bold mb-4 border-b pb-2" id="event-modal-title">予定の編集</h2>
      <input type="text" id="event-input" class="w-full border-gray-300 rounded p-3 mb-4 bg-gray-50 focus:bg-white outline-none ring-2 ring-blue-500 text-gray-800" placeholder="例: 14:00 教科部会">
      <input type="hidden" id="event-index">
      <div class="flex justify-end space-x-2">
        <button id="btn-cancel-event" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-semibold">キャンセル</button>
        <button id="btn-save-event" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold shadow">保存</button>
      </div>
    </div>
  </div>

  <!-- スキャンモーダル -->
  <div id="scan-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 flex flex-col max-h-full">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">週報・月報から予定を追加</h2>
      <p class="text-xs text-gray-500 mb-4">月報（月間行事予定表）や週報のPDF・画像をアップロードすると、Gemini AIが校内行事予定や「石川」先生の予定などを解析して抽出します。抽出された校内行事予定は月・週・日・年間予定すべてに反映されます。</p>
      <input type="file" id="file-upload" accept="image/*,application/pdf" class="mb-4 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700" />
      
      <!-- エラー表示エリア -->
      <div id="scan-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded border border-red-200 break-words"></div>

      <div id="scan-progress" class="hidden flex-col items-center justify-center py-6">
        <div class="ripple-loader mb-4"></div>
        <p class="text-sm text-gray-600 font-semibold loading-dots">AIがPDF/画像を解析中</p>
      </div>
      <div id="scan-result-area" class="hidden flex-1 overflow-y-auto mb-4 border rounded p-2 bg-gray-50 min-h-[150px]">
        <ul id="extracted-events-list" class="space-y-3"></ul>
      </div>
      <div class="flex justify-end space-x-2 mt-auto">
        <button id="btn-cancel-scan" class="px-4 py-2 bg-gray-200 rounded text-gray-700 font-semibold">キャンセル</button>
        <button id="btn-apply-scan" class="hidden px-4 py-2 bg-blue-600 text-white rounded font-semibold shadow">一括反映</button>
      </div>
    </div>
  </div>

  <!-- 手書きメモモーダル -->
  <div id="canvas-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-2 w-[95%] h-[90%] flex flex-col">
      <div class="flex justify-between items-center mb-2 px-2 border-b pb-2">
        <h3 class="font-bold text-gray-700" id="memo-date-title">手書きメモ</h3>
        <button id="btn-close-canvas" class="text-red-500 font-bold px-2 py-1 bg-red-50 rounded">閉じる</button>
      </div>
      <canvas id="memo-canvas" class="flex-1 border bg-yellow-50 rounded-lg touch-none"></canvas>
      <div class="mt-3 flex justify-between items-center px-2">
        <button id="btn-clear-canvas" class="px-4 py-2 bg-gray-200 rounded text-sm font-semibold">消去</button>
        <button id="btn-save-canvas" class="px-6 py-2 bg-green-600 text-white rounded text-sm font-bold shadow">保存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, documentId, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTnLD4voIU8O_YMl0ssOcUX5K7CC0y_Ew",
      authDomain: "task-6c861.firebaseapp.com",
      projectId: "task-6c861",
      storageBucket: "task-6c861.firebasestorage.app",
      messagingSenderId: "1075275802361",
      appId: "1:1075275802361:web:1ea82d964d789fdbb76428",
      measurementId: "G-YD37QJC2VK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // App State
    let appState = {
      currentView: 'day', 
      currentDate: new Date(),
      currentUserId: null,
      dayData: { timetableType: '通常', events: [], schoolEvents: [], memo: null }
    };

    const viewContainer = document.getElementById('view-container');
    const loginScreen = document.getElementById('login-screen');
    const authError = document.getElementById('auth-error');

    function formatDateStr(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }

    // === 認証 (Authentication) ===
    onAuthStateChanged(auth, (user) => {
      if (user) {
        appState.currentUserId = user.uid;
        loginScreen.classList.add('hidden');
        loadDataForCurrentDate();
      } else {
        appState.currentUserId = null;
        loginScreen.classList.remove('hidden');
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      if (!email || !pass) return authError.textContent = "メールとパスワードを入力してください。", authError.classList.remove('hidden');
      try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { authError.textContent = "ログイン失敗: " + e.message; authError.classList.remove('hidden'); }
    });

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      if (!email || !pass) return authError.textContent = "メールとパスワードを入力してください。", authError.classList.remove('hidden');
      try { await createUserWithEmailAndPassword(auth, email, pass); } catch (e) { authError.textContent = "登録失敗: " + e.message; authError.classList.remove('hidden'); }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      if (confirm("ログアウトしますか？")) signOut(auth);
    });

    // === 設定 (APIキー管理) ===
    document.getElementById('btn-settings').addEventListener('click', () => {
      document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('settings-modal').classList.remove('hidden');
    });

    document.getElementById('btn-cancel-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').classList.add('hidden');
    });

    document.getElementById('btn-save-settings').addEventListener('click', () => {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      alert("APIキーを保存しました。");
      document.getElementById('settings-modal').classList.add('hidden');
    });

    // === Firestore データ制御 ===
    async function loadDataForCurrentDate() {
      if (!appState.currentUserId) return;
      const dateStr = formatDateStr(appState.currentDate);
      try {
        const docRef = doc(db, "users", appState.currentUserId, "planner_data", dateStr);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          appState.dayData = docSnap.data();
          if(!appState.dayData.events) appState.dayData.events = [];
          if(!appState.dayData.schoolEvents) appState.dayData.schoolEvents = [];
        } else {
          appState.dayData = { timetableType: '通常', events: [], schoolEvents: [], memo: null };
        }
        renderView();
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    async function saveCurrentDayData() {
      if (!appState.currentUserId) return;
      const dateStr = formatDateStr(appState.currentDate);
      try {
        const docRef = doc(db, "users", appState.currentUserId, "planner_data", dateStr);
        await setDoc(docRef, appState.dayData);
      } catch (e) {
        console.error("Error saving data:", e);
      }
    }

    // 指定した日付範囲（YYYY-MM-DD〜YYYY-MM-DD）の校内行事予定をまとめて取得する
    // 月報から抽出した校内行事予定を月／週／年間の各ビューに反映するために使用
    async function fetchSchoolEventsInRange(startStr, endStr) {
      const result = {};
      if (!appState.currentUserId) return result;
      try {
        const colRef = collection(db, "users", appState.currentUserId, "planner_data");
        const q = query(colRef, where(documentId(), '>=', startStr), where(documentId(), '<=', endStr));
        const snap = await getDocs(q);
        snap.forEach(docSnap => {
          const data = docSnap.data();
          if (data.schoolEvents && data.schoolEvents.length > 0) {
            result[docSnap.id] = data.schoolEvents;
          }
        });
      } catch (e) {
        console.error("Error fetching school events range:", e);
      }
      return result;
    }

    // === 画面描画制御 ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        appState.currentView = e.target.dataset.view;
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('bg-white', 'text-gray-800', 'font-bold'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.add('text-gray-300'));
        e.target.classList.remove('text-gray-300');
        e.target.classList.add('bg-white', 'text-gray-800', 'font-bold');
        renderView();
      });
    });

    async function renderView(animationClass = '') {
      viewContainer.className = `bg-white h-full rounded-xl shadow-lg border border-gray-200 overflow-y-auto flex flex-col ${animationClass}`;

      switch (appState.currentView) {
        case 'month': await renderMonthView(); break;
        case 'week': await renderWeekView(); break;
        case 'day': renderDayView(); break;
        case 'year': await renderYearView(); break;
        case 'class-matrix': renderClassMatrix(); break;
      }

      if (animationClass) {
        setTimeout(() => viewContainer.classList.remove(animationClass), 300);
      }
    }

    async function renderMonthView() {
      const year = appState.currentDate.getFullYear();
      const month = appState.currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthStr = String(month + 1).padStart(2, '0');
      const startStr = `${year}-${monthStr}-01`;
      const endStr = `${year}-${monthStr}-${String(daysInMonth).padStart(2, '0')}`;
      const schoolEventsMap = await fetchSchoolEventsInRange(startStr, endStr);

      let html = `
        <div class="p-3 bg-gray-50 border-b flex justify-between items-center">
          <button data-action="prev-month" class="px-3 py-1 bg-white border rounded shadow-sm font-bold text-gray-600">＜</button>
          <div class="font-bold text-lg cursor-pointer" data-action="today">${year}年 ${month + 1}月</div>
          <button data-action="next-month" class="px-3 py-1 bg-white border rounded shadow-sm font-bold text-gray-600">＞</button>
        </div>
        <div class="flex-1 grid grid-cols-7 gap-px bg-gray-200 border-b">
      `;
      ['日', '月', '火', '水', '木', '金', '土'].forEach(d => html += `<div class="bg-gray-100 text-center py-2 text-xs font-semibold text-gray-700">${d}</div>`);

      for (let i = 0; i < firstDay; i++) html += `<div class="bg-gray-50 p-1 h-20 md:h-24"></div>`;
      for (let i = 1; i <= daysInMonth; i++) {
        const isToday = (i === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear());
        const dateStyle = isToday ? "bg-blue-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center" : "text-gray-700";
        const dateStr = `${year}-${monthStr}-${String(i).padStart(2, '0')}`;
        const dayEvents = schoolEventsMap[dateStr] || [];
        const previewHtml = dayEvents.slice(0, 2).map(ev => `<div class="text-[10px] leading-tight bg-red-100 text-red-700 rounded px-1 truncate mt-0.5">${ev}</div>`).join('');
        const moreHtml = dayEvents.length > 2 ? `<div class="text-[9px] text-gray-400 mt-0.5">+${dayEvents.length - 2}件</div>` : '';
        html += `
          <div data-action="go-day" data-date="${dateStr}" class="bg-white p-1 h-20 md:h-24 flex flex-col border-b border-r cursor-pointer hover:bg-blue-50 overflow-hidden">
            <div class="text-right text-xs"><span class="${dateStyle} font-semibold">${i}</span></div>
            <div class="flex-1 overflow-hidden">${previewHtml}${moreHtml}</div>
          </div>
        `;
      }
      const totalCells = firstDay + daysInMonth;
      const trailingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 0; i < trailingCells; i++) html += `<div class="bg-gray-50 p-1 h-20 md:h-24"></div>`;

      viewContainer.innerHTML = html + `</div>`;
    }

    async function renderWeekView() {
      const d = new Date(appState.currentDate);
      d.setDate(d.getDate() - d.getDay());
      const startStr = `${d.getMonth() + 1}/${d.getDate()}`;
      const endDate = new Date(d);
      endDate.setDate(d.getDate() + 6);
      const endStr = `${endDate.getMonth() + 1}/${endDate.getDate()}`;

      const schoolEventsMap = await fetchSchoolEventsInRange(formatDateStr(d), formatDateStr(endDate));

      let html = `
        <div class="p-3 bg-gray-50 border-b flex justify-between items-center">
          <button data-action="prev-week" class="px-3 py-1 bg-white border rounded shadow-sm font-bold text-gray-600">＜</button>
          <div class="font-bold text-md cursor-pointer" data-action="today">${startStr} 〜 ${endStr}</div>
          <button data-action="next-week" class="px-3 py-1 bg-white border rounded shadow-sm font-bold text-gray-600">＞</button>
        </div>
        <div class="flex-1 flex flex-col overflow-auto bg-gray-200 gap-px">
      `;
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      for (let i = 0; i < 7; i++) {
        const currentLoopDate = new Date(d);
        currentLoopDate.setDate(d.getDate() + i);
        const dayNum = currentLoopDate.getDate();
        const dateStr = formatDateStr(currentLoopDate);
        const isToday = (currentLoopDate.toDateString() === new Date().toDateString());
        const bgClass = isToday ? "bg-blue-50" : "bg-white";
        const dayEvents = schoolEventsMap[dateStr] || [];
        const eventsHtml = dayEvents.length > 0
          ? dayEvents.map(ev => `<div class="text-xs bg-red-50 text-red-700 rounded px-1 mb-0.5 truncate">🏫 ${ev}</div>`).join('')
          : `<div class="text-xs text-gray-400 mt-1">タップして詳細</div>`;

        html += `
          <div data-action="go-day" data-date="${dateStr}" class="${bgClass} flex-1 p-2 flex border-b cursor-pointer hover:bg-gray-50">
            <div class="w-12 text-center border-r pr-2 mr-2 flex-shrink-0">
              <div class="text-xs text-gray-500 font-bold">${dayNames[i]}</div>
              <div class="text-lg font-bold text-gray-800">${dayNum}</div>
            </div>
            <div class="flex-1 text-sm text-gray-600 overflow-hidden">
               ${eventsHtml}
            </div>
          </div>
        `;
      }
      viewContainer.innerHTML = html + `</div>`;
    }

    function renderDayView() {
      const dateColor = (appState.dayData.timetableType !== '通常') ? 'text-red-600 border-red-600 bg-red-50' : 'text-gray-800 border-gray-300';
      const dateStrDisplay = `${appState.currentDate.getFullYear()}年${appState.currentDate.getMonth() + 1}月${appState.currentDate.getDate()}日`;

      const schoolEvents = appState.dayData.schoolEvents || [];
      let schoolEventsHtml = schoolEvents.length > 0
        ? schoolEvents.map((ev, idx) => `
            <li class="p-3 bg-red-50 rounded border border-red-100 mb-2 flex justify-between items-center shadow-sm">
              <span class="flex-1 text-red-900 font-medium">🏫 ${ev}</span>

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // Geminiのモデルは提供終了・入れ替わりが頻繁にあるため、モデル名を固定せず
    // 利用可能なモデル一覧から動的に選択する（GoogleがモデルをEOLにしても壊れないようにするため）
    const GEMINI_MODEL_CACHE_KEY = 'gemini_model_cache';
    const GEMINI_MODEL_CACHE_TTL = 24 * 60 * 60 * 1000; // 24時間

    async function pickAvailableGeminiModel(apiKey, forceRefresh = false) {
      if (!forceRefresh) {
        try {
          const cached = JSON.parse(localStorage.getItem(GEMINI_MODEL_CACHE_KEY) || 'null');
          if (cached && cached.apiKey === apiKey && (Date.now() - cached.timestamp) < GEMINI_MODEL_CACHE_TTL) {
            return cached.model;
          }
        } catch (e) { /* キャッシュ破損時は無視して再取得 */ }
      }

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      if (!res.ok) {
        if (res.status === 400) {
          throw new Error("APIキーが無効です。設定から正しいキーを登録し直してください。");
        }
        throw new Error("利用可能なAIモデルの取得に失敗しました。しばらくしてから再度お試しください。");
      }
      const data = await res.json();
      const candidates = (data.models || []).filter(m =>
        m.name && m.name.includes('gemini') &&
        Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent') &&
        !/embedding|aqa|vision|tts|image-generation|preview|exp/i.test(m.name)
      );
      if (candidates.length === 0) {
        throw new Error("利用可能なGeminiモデルが見つかりませんでした。Google AI Studioでご利用のAPIキーの状態をご確認ください。");
      }
      // 無料枠でも動きやすいFlash系（liteは精度が落ちるため優先度を下げる）を優先し、同カテゴリ内ではバージョンの新しいものを選ぶ
      const byNewest = (list) => list.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }))[0];
      const flashModels = candidates.filter(m => /flash/i.test(m.name) && !/lite/i.test(m.name));
      const flashLiteModels = candidates.filter(m => /flash/i.test(m.name) && /lite/i.test(m.name));
      const chosen = byNewest(flashModels.length > 0 ? flashModels : (flashLiteModels.length > 0 ? flashLiteModels : candidates));
      const modelId = chosen.name.replace(/^models\//, '');

      localStorage.setItem(GEMINI_MODEL_CACHE_KEY, JSON.stringify({ apiKey, model: modelId, timestamp: Date.now() }));
      return modelId;
    }

    async function callGeminiAPI(base64Data, mimeType) {
      // ローカルストレージからAPIキーを取得
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        throw new Error("APIキーが設定されていません。右上の「⚙️設定」ボタンからキーを登録してください。");
      }

      const prompt = `
        あなたは優秀な中学校のスケジュールアシスタントです。
        アップロードされたファイルは、中学校の月報（月間行事予定表）または週報（PDFまたは画像）です。
        月報は日付ごと・週ごとにマス目やカレンダー形式、あるいは表形式で校内行事予定が並んでいることが多く、レイアウトが崩れて見えても、日付と行事名の対応関係を丁寧に読み取ってください。
        このファイルから以下の情報を抽出し、必ず指定されたJSON配列フォーマットで出力してください。

        【抽出する対象】
        1. 校内行事予定：月報に記載されている学校全体の行事・特別な日課（例: 始業式、参観日、定期テスト、避難訓練、生徒総会、短縮日課など）。月報からはこれを最優先かつ網羅的に抽出してください。
        2. 「石川」先生に関連する個人の予定（会議、出張、部活動など）
        3. 時間割の変更情報（例: 月1を火2へ変更、授業のカット等）

        【重要なルール】
        ・推測で予定を作らないでください。
        ・ファイルに記載されていない日付のデータは出力しないでください。
        ・資料に年度・月の記載がある場合はそれをもとにYYYY-MM-DD形式の日付へ正しく変換してください。
        ・同じ日に複数の行事がある場合は、それぞれを別々の配列要素として出力してください。
        ・Markdownのバッククォート（\`\`\`json など）は絶対に含めず、純粋なJSON配列のみを出力してください。
        ・出力トークンを節約するため、改行・インデント・余分な空白を一切入れず、必ず1行の圧縮されたJSON配列として出力してください。

        【出力フォーマット（実際は改行を入れず1行で出力すること）】
        [{"date": "YYYY-MM-DD", "type": "行事", "text": "始業式（短縮日課）"}, {"date": "YYYY-MM-DD", "type": "石川", "text": "14:00 教科部会"}, {"date": "YYYY-MM-DD", "type": "変更", "text": "3限の授業カット"}]
      `;

      const requestBody = {
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64Data } }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.1,
          maxOutputTokens: 65536
        }
      };

      async function callWithModel(modelId, body) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }

      let modelId = await pickAvailableGeminiModel(apiKey);
      let response = await callWithModel(modelId, requestBody);

      // キャッシュしていたモデルが提供終了になっていた場合、最新の一覧を取得し直して1度だけ再試行
      if (!response.ok && response.status === 404) {
        modelId = await pickAvailableGeminiModel(apiKey, true);
        response = await callWithModel(modelId, requestBody);
      }

      // maxOutputTokensの値がモデルの上限を超えて拒否された場合、指定なし（モデルの既定値）で再試行
      if (!response.ok && response.status === 400) {
        const preErrText = await response.clone().text();
        if (preErrText.includes("max_tokens") || preErrText.includes("maxOutputTokens")) {
          const fallbackBody = { ...requestBody, generationConfig: { responseMimeType: "application/json", temperature: 0.1 } };
          response = await callWithModel(modelId, fallbackBody);
        }
      }

      if (!response.ok) {
        const errText = await response.text();
        // APIキー無効時のエラーメッセージを分かりやすく
        if (response.status === 400 && errText.includes("API key not valid")) {
          throw new Error("APIキーが無効です。設定から正しいキーを登録し直してください。");
        }
        // ペイロードが大きすぎる（PDFが重すぎる）場合
        if (response.status === 413 || errText.includes("Payload Too Large")) {
          throw new Error("ファイルサイズが大きすぎます。PDFのページ数を減らすか、画像にしてアップロードしてください。");
        }
        // 利用モデルがAPIキーの利用可能枠で提供終了・未対応の場合
        if (response.status === 404) {
          throw new Error("現在利用できるAIモデルが見つかりませんでした。Google AI Studioで有効なAPIキーの状態をご確認のうえ、再度お試しください。");
        }
        // 無料枠の利用上限（クォータ）を超えた場合
        if (response.status === 429 || errText.includes("RESOURCE_EXHAUSTED") || errText.includes("exceeded your current quota")) {
          throw new Error("APIキーの利用上限（クォータ）に達しました。無料枠は1日あたりのリクエスト数や1分あたりの回数に制限があります。しばらく時間をおくか、Google AI Studioでプランや請求設定をご確認ください。");
        }
        throw new Error(`エラーが発生しました (${response.status}): ${errText}`);
      }

      const data = await response.json();
      const candidate = data.candidates && data.candidates[0];
      const resultText = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;

      if (!resultText) {
        if (candidate && candidate.finishReason === 'MAX_TOKENS') {
          throw new Error("月報の行事予定が多く、AIの応答が出力上限に達して途中で切れました。ファイルのページ数を減らすか、複数回に分けてアップロードしてください。");
        }
        throw new Error("AIから解析結果を取得できませんでした。もう一度お試しください。");
      }

      try {
        return JSON.parse(resultText);
      } catch (e) {
        if (candidate.finishReason === 'MAX_TOKENS') {
          throw new Error("月報の行事予定が多く、AIの応答が出力上限に達して途中で切れました。ファイルのページ数を減らすか、複数回に分けてアップロードしてください。");
        }
        throw new Error("AIの応答をJSONとして解析できませんでした。もう一度お試しいただくか、ファイルの解像度・ページ数を見直してください。");
      }
    }

        const docRef = doc(db, "users", appState.currentUserId, "planner_data", dateStr);
        const docSnap = await getDoc(docRef);
        let data = docSnap.exists() ? docSnap.data() : { timetableType: '通常', events: [], schoolEvents: [], memo: null };
        if(!data.events) data.events = [];
        if(!data.schoolEvents) data.schoolEvents = [];
        data.events.push(...newData.events);
        data.schoolEvents.push(...newData.schoolEvents);
        if ([...newData.events, ...newData.schoolEvents].some(e => e.includes('短縮'))) data.timetableType = '短縮';
        await setDoc(docRef, data);
      }
      alert("校内行事予定・予定を一括でカレンダーに反映しました！月・週・日・年間予定に反映されます。");
      await loadDataForCurrentDate();
      document.getElementById('scan-modal').classList.add('hidden');
      document.getElementById('file-upload').value = ''; // 次回のためにリセット
    });

    // === キャンバス (メモ機能) ===
    const canvasModal = document.getElementById('canvas-modal');
    const canvas = document.getElementById('memo-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    function openCanvasModal() {
      document.getElementById('memo-date-title').textContent = `${appState.currentDate.getMonth() + 1}月${appState.currentDate.getDate()}日のメモ`;
      canvasModal.classList.remove('hidden');
      setTimeout(() => {
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
        ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.fillStyle = "#fefce8"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, 50);
    }
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX || e.touches?.[0].clientX) - rect.left, y: (e.clientY || e.touches?.[0].clientY) - rect.top };
    }
    canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    canvas.addEventListener('pointerdown', e => { isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('pointermove', e => { if (!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
    ['pointerup', 'pointerout', 'pointercancel'].forEach(evt => canvas.addEventListener(evt, () => isDrawing = false));
    document.getElementById('btn-close-canvas').addEventListener('click', () => canvasModal.classList.add('hidden'));
    document.getElementById('btn-clear-canvas').addEventListener('click', () => { ctx.fillRect(0, 0, canvas.width, canvas.height); });
    document.getElementById('btn-save-canvas').addEventListener('click', async () => {
      appState.dayData.memo = canvas.toDataURL('image/png');
      await saveCurrentDayData();
      renderView();
      canvasModal.classList.add('hidden');
    });
  </script>
</body>
</html>
