<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>デジタル教師手帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ripple-loader {
      width: 40px; height: 40px;
      border-radius: 50%; border: 3px solid #3b82f6;
      animation: ripple 1.2s infinite ease-in-out;
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .loading-dots::after {
      content: ''; animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; } 40% { content: '.'; }
      60% { content: '..'; } 80%, 100% { content: '...'; }
    }
    .slide-enter-right { animation: slideInRight 0.3s ease-out forwards; }
    .slide-enter-left { animation: slideInLeft 0.3s ease-out forwards; }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0.5; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-100%); opacity: 0.5; }
      to { transform: translateX(0); opacity: 1; }
    }
    .matrix-table { width: 100%; height: 100%; border-collapse: collapse; }
    .matrix-table tbody { height: 100%; }
    .matrix-table tr { height: 1%; }
    .matrix-table td, .matrix-table th { border: 1px solid #e5e7eb; padding: 4px; vertical-align: top; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden relative">

  <!-- ログイン・新規登録画面 -->
  <div id="login-screen" class="fixed inset-0 bg-gray-800 z-[100] flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">📖 デジタル教師手帳</h2>
        <p class="text-sm text-gray-500 mt-2">アカウントにログインして同期</p>
      </div>
      
      <div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded border border-red-200"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">メールアドレス</label>
          <input type="email" id="auth-email" class="w-full border border-gray-300 p-2 rounded bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="teacher@example.com">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">パスワード</label>
          <input type="password" id="auth-pass" class="w-full border border-gray-300 p-2 rounded bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="6文字以上">
        </div>
        <div class="pt-2 space-y-3">
          <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded shadow transition-colors">ログイン</button>
          <button id="btn-signup" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded shadow transition-colors">新規アカウント登録</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-gray-800 text-white p-3 flex justify-between items-center shadow-md z-20">
    <h1 class="text-lg font-bold truncate flex-shrink-0 mr-2">📖 手帳</h1>
    <nav class="flex space-x-1 bg-gray-700 rounded-lg p-1 text-sm overflow-x-auto flex-1 justify-center hide-scrollbar" id="view-tabs">
      <button data-view="month" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">月</button>
      <button data-view="week" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">週</button>
      <button data-view="day" class="tab-btn px-2 py-1 md:px-3 rounded-md bg-white text-gray-800 font-bold whitespace-nowrap">日</button>
      <button data-view="class-matrix" class="tab-btn px-2 py-1 md:px-3 rounded-md text-gray-300 whitespace-nowrap">週授業</button>
    </nav>
    <div class="flex items-center ml-2 space-x-2">
      <button id="btn-scan" class="bg-blue-600 hover:bg-blue-500 p-1 md:px-2 rounded text-sm flex items-center shadow whitespace-nowrap" title="週報スキャン">
        📸
      </button>
      <button id="btn-logout" class="bg-gray-600 hover:bg-gray-500 p-1 md:px-2 rounded text-sm flex items-center shadow whitespace-nowrap" title="ログアウト">
        🚪
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="swipe-container" class="flex-1 overflow-hidden relative p-2 touch-pan-y">
    <div id="view-container" class="bg-white h-full rounded-xl shadow-lg border border-gray-200 overflow-y-auto transition-transform duration-300">
      <div class="flex h-full items-center justify-center text-gray-400">データを読み込み中...</div>
    </div>
  </main>

  <!-- フッター -->
  <footer id="footer-stats" class="bg-white border-t px-4 py-2 text-sm text-gray-600 hidden">
    技術科 授業数: <span id="tech-class-count" class="font-bold text-blue-600">0</span> コマ
  </footer>

  <!-- 予定の追加・編集モーダル -->
  <div id="event-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 flex flex-col">
      <h2 class="text-xl font-bold mb-4 border-b pb-2" id="event-modal-title">予定の編集</h2>
      <input type="text" id="event-input" class="w-full border-gray-300 rounded p-3 mb-4 bg-gray-50 focus:bg-white outline-none ring-2 ring-blue-500 text-gray-800" placeholder="例: 14:00 教科部会">
      <input type="hidden" id="event-index">
      <div class="flex justify-end space-x-2">
        <button id="btn-cancel-event" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-semibold transition-colors">キャンセル</button>
        <button id="btn-save-event" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold shadow transition-colors">保存</button>
      </div>
    </div>
  </div>

  <!-- スキャンモーダル -->
  <div id="scan-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 flex flex-col max-h-full">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">週報から予定を追加</h2>
      <input type="file" id="file-upload" accept="image/*,application/pdf" class="mb-4 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700" />
      <div id="scan-progress" class="hidden flex-col items-center justify-center py-6">
        <div class="ripple-loader mb-4"></div>
        <p class="text-sm text-gray-600 font-semibold loading-dots">Geminiが予定を抽出中</p>
      </div>
      <div id="scan-result-area" class="hidden flex-1 overflow-y-auto mb-4 border rounded p-2 bg-gray-50 min-h-[150px]">
        <ul id="extracted-events-list" class="space-y-2"></ul>
      </div>
      <div class="flex justify-end space-x-2 mt-auto">
        <button id="btn-cancel-scan" class="px-4 py-2 bg-gray-200 rounded text-gray-700 font-semibold">キャンセル</button>
        <button id="btn-apply-scan" class="hidden px-4 py-2 bg-blue-600 text-white rounded font-semibold shadow">反映</button>
      </div>
    </div>
  </div>

  <!-- 手書きメモモーダル -->
  <div id="canvas-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-2 w-[95%] h-[90%] flex flex-col">
      <div class="flex justify-between items-center mb-2 px-2 border-b pb-2">
        <h3 class="font-bold text-gray-700" id="memo-date-title">手書きメモ</h3>
        <button id="btn-close-canvas" class="text-red-500 font-bold px-2 py-1 bg-red-50 rounded">閉じる</button>
      </div>
      <canvas id="memo-canvas" class="flex-1 border bg-yellow-50 rounded-lg touch-none"></canvas>
      <div class="mt-3 flex justify-between items-center px-2">
        <button id="btn-clear-canvas" class="px-4 py-2 bg-gray-200 rounded text-sm font-semibold">消去</button>
        <button id="btn-save-canvas" class="px-6 py-2 bg-green-600 text-white rounded text-sm font-bold shadow">保存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTnLD4voIU8O_YMl0ssOcUX5K7CC0y_Ew",
      authDomain: "task-6c861.firebaseapp.com",
      projectId: "task-6c861",
      storageBucket: "task-6c861.firebasestorage.app",
      messagingSenderId: "1075275802361",
      appId: "1:1075275802361:web:1ea82d964d789fdbb76428",
      measurementId: "G-YD37QJC2VK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // App State
    let appState = {
      currentView: 'day', // 最初は日ビューを開く
      currentDate: new Date(),
      currentUserId: null,
      dayData: { timetableType: '通常', events: [], memo: null }
    };

    const viewContainer = document.getElementById('view-container');
    const footerStats = document.getElementById('footer-stats');
    const loginScreen = document.getElementById('login-screen');
    const authError = document.getElementById('auth-error');

    // === 認証 (Authentication) 制御 ===
    
    // ログイン状態の監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // ログイン成功
        appState.currentUserId = user.uid;
        loginScreen.classList.add('hidden');
        loadDataForCurrentDate();
      } else {
        // ログアウト状態
        appState.currentUserId = null;
        loginScreen.classList.remove('hidden');
      }
    });

    function showAuthError(message) {
      authError.textContent = message;
      authError.classList.remove('hidden');
    }

    // ログインボタン処理
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      if (!email || !pass) return showAuthError("メールアドレスとパスワードを入力してください。");
      
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        showAuthError("ログイン失敗: " + error.message);
      }
    });

    // 新規登録ボタン処理
    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      if (!email || !pass) return showAuthError("メールアドレスとパスワードを入力してください。");
      
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        showAuthError("登録失敗: " + error.message);
      }
    });

    // ログアウトボタン処理
    document.getElementById('btn-logout').addEventListener('click', () => {
      if (confirm("ログアウトしますか？")) {
        signOut(auth);
      }
    });

    // === Firestore Data Functions ===
    function getTodayStr() {
      const d = appState.currentDate;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    async function loadDataForCurrentDate() {
      if (!appState.currentUserId) return;
      const dateStr = getTodayStr();
      viewContainer.innerHTML = `<div class="flex h-full items-center justify-center text-gray-400">読み込み中...</div>`;
      try {
        const docRef = doc(db, "users", appState.currentUserId, "planner_data", dateStr);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          appState.dayData = docSnap.data();
          if(!appState.dayData.events) appState.dayData.events = [];
        } else {
          appState.dayData = { timetableType: '通常', events: [], memo: null };
        }
        renderView();
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    async function saveCurrentDayData() {
      if (!appState.currentUserId) return;
      const dateStr = getTodayStr();
      try {
        const docRef = doc(db, "users", appState.currentUserId, "planner_data", dateStr);
        await setDoc(docRef, appState.dayData);
      } catch (e) {
        console.error("Error saving data:", e);
      }
    }

    // === ビューの切り替え処理 ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        appState.currentView = e.target.dataset.view;
        document.querySelectorAll('.tab-btn').forEach(t => {
          t.classList.remove('bg-white', 'text-gray-800', 'font-bold');
          t.classList.add('text-gray-300');
        });
        e.target.classList.remove('text-gray-300');
        e.target.classList.add('bg-white', 'text-gray-800', 'font-bold');
        renderView();
      });
    });

    function renderView(animationClass = '') {
      viewContainer.className = `bg-white h-full rounded-xl shadow-lg border border-gray-200 overflow-y-auto ${animationClass}`;
      viewContainer.innerHTML = '';
      footerStats.classList.add('hidden');

      switch (appState.currentView) {
        case 'month': renderMonthView(); break;
        case 'week': viewContainer.innerHTML = `<div class="p-4"><h2 class="font-bold">週間ビュー</h2></div>`; break;
        case 'day': renderDayView(); break;
        case 'class-matrix': renderClassMatrix(); break;
      }
      
      if (animationClass) {
        setTimeout(() => viewContainer.classList.remove(animationClass), 300);
      }
    }

    function renderMonthView() {
      let html = `<div class="h-full flex flex-col"><div class="p-3 bg-gray-50 border-b font-bold text-center">${appState.currentDate.getFullYear()}年 ${appState.currentDate.getMonth() + 1}月</div><div class="flex-1 grid grid-cols-7 gap-px bg-gray-200 border-b">`;
      ['日', '月', '火', '水', '木', '金', '土'].forEach(d => html += `<div class="bg-gray-100 text-center py-1 text-xs font-semibold">${d}</div>`);
      for (let i = 1; i <= 35; i++) {
        html += `<div class="bg-white p-1 h-20 md:h-24 hover:bg-gray-50 flex flex-col border-b border-r"><span class="text-right text-xs text-gray-500">${i<=31?i:''}</span></div>`;
      }
      viewContainer.innerHTML = html + `</div></div>`;
    }

    function renderDayView() {
      const dateColor = (appState.dayData.timetableType !== '通常') ? 'text-red-600 border-red-600' : 'text-gray-800 border-gray-300';
      
      let eventsHtml = appState.dayData.events.length > 0 
        ? appState.dayData.events.map((e, idx) => `
            <li class="p-3 bg-blue-50 rounded border border-blue-100 mb-2 flex justify-between items-center group shadow-sm">
              <span class="flex-1 text-blue-900">${e.text || e}</span>
              <div class="space-x-1 flex-shrink-0">
                <button data-action="edit" data-index="${idx}" class="text-blue-500 hover:bg-blue-200 px-2 py-1 rounded transition-colors text-xs font-bold border border-blue-200 bg-white">編集</button>
                <button data-action="delete" data-index="${idx}" class="text-red-500 hover:bg-red-200 px-2 py-1 rounded transition-colors text-xs font-bold border border-red-200 bg-white">削除</button>
              </div>
            </li>
          `).join('') 
        : '<p class="text-gray-500 italic mb-2">予定はありません</p>';

      eventsHtml += `
        <button id="btn-add-event" class="w-full mt-2 py-3 border-2 border-dashed border-gray-300 text-gray-500 rounded-lg hover:bg-gray-50 hover:text-blue-500 transition-colors font-semibold flex items-center justify-center">
          <span class="mr-1">＋</span> 新しい予定を追加
        </button>
      `;

      viewContainer.innerHTML = `
        <div class="p-4 h-full flex flex-col">
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <div>
              <h2 class="text-xl font-bold">${getTodayStr()}</h2>
              <span class="text-sm border px-2 py-0.5 rounded font-bold mt-1 inline-block ${dateColor}">${appState.dayData.timetableType}日課</span>
            </div>
            <button id="btn-open-memo" class="bg-yellow-100 text-yellow-800 px-3 py-2 rounded-lg shadow text-sm font-bold flex items-center">✍️ メモ</button>
          </div>
          <div class="flex-1 overflow-auto pb-6">
            <h3 class="font-bold text-gray-600 mb-3 border-l-4 border-blue-500 pl-2">本日の予定</h3>
            <ul class="mb-6">${eventsHtml}</ul>
            ${appState.dayData.memo ? `<h3 class="font-bold text-gray-600 mt-6 mb-2 border-l-4 border-yellow-500 pl-2">手書きメモ</h3><img src="${appState.dayData.memo}" class="border rounded-lg bg-yellow-50 w-full shadow-sm" />` : ''}
          </div>
        </div>
      `;
      
      document.getElementById('btn-open-memo').addEventListener('click', openCanvasModal);
    }

    // === 予定の追加・編集・削除 ===
    viewContainer.addEventListener('click', async (e) => {
      if (appState.currentView !== 'day') return;

      const editBtn = e.target.closest('button[data-action="edit"]');
      const delBtn = e.target.closest('button[data-action="delete"]');
      const addBtn = e.target.closest('#btn-add-event');

      if (editBtn) {
        const idx = parseInt(editBtn.dataset.index);
        openEventModal(idx);
      } else if (delBtn) {
        const idx = parseInt(delBtn.dataset.index);
        if (confirm("この予定を削除しますか？")) {
          appState.dayData.events.splice(idx, 1);
          await saveCurrentDayData();
          renderView();
        }
      } else if (addBtn) {
        openEventModal(-1);
      }
    });

    const eventModal = document.getElementById('event-modal');
    const eventInput = document.getElementById('event-input');
    const eventIndexInput = document.getElementById('event-index');
    const eventModalTitle = document.getElementById('event-modal-title');

    function openEventModal(index) {
      if (index >= 0) {
        eventModalTitle.textContent = '予定の編集';
        const ev = appState.dayData.events[index];
        eventInput.value = ev.text || ev;
        eventIndexInput.value = index;
      } else {
        eventModalTitle.textContent = '予定の追加';
        eventInput.value = '';
        eventIndexInput.value = -1;
      }
      eventModal.classList.remove('hidden');
      setTimeout(() => eventInput.focus(), 100);
    }

    document.getElementById('btn-cancel-event').addEventListener('click', () => {
      eventModal.classList.add('hidden');
    });

    document.getElementById('btn-save-event').addEventListener('click', async () => {
      const val = eventInput.value.trim();
      if (!val) {
        alert("予定を入力してください");
        return;
      }
      const idx = parseInt(eventIndexInput.value);
      if (idx >= 0) {
        appState.dayData.events[idx] = val;
      } else {
        appState.dayData.events.push(val);
      }
      await saveCurrentDayData();
      renderView();
      eventModal.classList.add('hidden');
    });

    function renderClassMatrix() {
      footerStats.classList.remove('hidden');
      let html = `<table class="matrix-table text-xs md:text-sm bg-white"><thead><tr class="bg-gray-100"><th class="w-10">限</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th></tr></thead><tbody>`;
      for (let i = 1; i <= 6; i++) {
        html += `<tr><td class="text-center font-bold bg-gray-50">${i}</td><td/><td/><td class="bg-blue-50 text-blue-800">2年1組 技術</td><td/><td/></tr>`;
      }
      viewContainer.innerHTML = html + `</tbody></table>`;
      document.getElementById('tech-class-count').textContent = "1";
    }

    // === スワイプ操作 ===
    const swipeZone = document.getElementById('swipe-container');
    let touchStartX = 0, touchStartY = 0;
    swipeZone.addEventListener('touchstart', e => { touchStartX = e.touches[0].screenX; touchStartY = e.touches[0].screenY; }, {passive: true});
    swipeZone.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diffX) > 60 && Math.abs(e.changedTouches[0].screenY - touchStartY) < 40) {
        const d = appState.currentDate;
        d.setDate(d.getDate() + (diffX < 0 ? 1 : -1));
        viewContainer.innerHTML = `<div class="flex h-full items-center justify-center text-gray-400">読み込み中...</div>`;
        loadDataForCurrentDate().then(() => renderView(diffX < 0 ? 'slide-enter-right' : 'slide-enter-left'));
      }
    }, {passive: true});

    // === スキャンモック ===
    document.getElementById('btn-scan').addEventListener('click', () => {
      document.getElementById('scan-modal').classList.remove('hidden');
      document.getElementById('scan-result-area').classList.add('hidden');
      document.getElementById('btn-apply-scan').classList.add('hidden');
    });
    
    document.getElementById('btn-cancel-scan').addEventListener('click', () => document.getElementById('scan-modal').classList.add('hidden'));

    document.getElementById('file-upload').addEventListener('change', (e) => {
      if (!e.target.files[0]) return;
      document.getElementById('scan-progress').classList.remove('hidden');
      
      setTimeout(() => {
        document.getElementById('scan-progress').classList.add('hidden');
        const list = document.getElementById('extracted-events-list');
        list.innerHTML = `
          <li class="bg-white p-2 rounded shadow-sm border text-sm flex items-center">
            <span class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded mr-2">学校</span>
            <input type="text" value="全校集会（短縮日課）" class="w-full bg-transparent outline-none scan-val" />
          </li>
        `;
        document.getElementById('scan-result-area').classList.remove('hidden');
        document.getElementById('btn-apply-scan').classList.remove('hidden');
      }, 1500);
    });

    document.getElementById('btn-apply-scan').addEventListener('click', async () => {
      const inputs = document.querySelectorAll('.scan-val');
      appState.dayData.timetableType = '短縮';
      inputs.forEach(input => appState.dayData.events.push(input.value));
      await saveCurrentDayData();
      renderView();
      document.getElementById('scan-modal').classList.add('hidden');
    });

    // === キャンバス (メモ機能) ===
    const canvasModal = document.getElementById('canvas-modal');
    const canvas = document.getElementById('memo-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function openCanvasModal() {
      document.getElementById('memo-date-title').textContent = `${appState.currentDate.getMonth() + 1}月${appState.currentDate.getDate()}日のメモ`;
      canvasModal.classList.remove('hidden');
      setTimeout(() => {
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
        ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.fillStyle = "#fefce8"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, 50);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX || e.touches?.[0].clientX) - rect.left, y: (e.clientY || e.touches?.[0].clientY) - rect.top };
    }

    canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    canvas.addEventListener('pointerdown', e => { isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('pointermove', e => { if (!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
    ['pointerup', 'pointerout', 'pointercancel'].forEach(evt => canvas.addEventListener(evt, () => isDrawing = false));

    document.getElementById('btn-close-canvas').addEventListener('click', () => canvasModal.classList.add('hidden'));
    document.getElementById('btn-clear-canvas').addEventListener('click', () => { ctx.fillRect(0, 0, canvas.width, canvas.height); });
    
    document.getElementById('btn-save-canvas').addEventListener('click', async () => {
      appState.dayData.memo = canvas.toDataURL('image/png');
      await saveCurrentDayData();
      renderView();
      canvasModal.classList.add('hidden');
    });

  </script>
</body>
</html>
